name: Create Jira issue
on:
  issues:
    types:
      - opened
permissions:
  issues: write
  contents: write
  pull-requests: write
jobs:
  create-issue:
    name: Create Jira issue
    runs-on: ubuntu-latest

    steps:
      # 0. Jira 로그인
      - name: Login
        uses: atlassian/gajira-login@v3
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}

      # 1. develop 브랜치 체크아웃 (개발용 브랜치)
      - name: Checkout develop code
        uses: actions/checkout@v4
        with:
          ref: develop

      # 2. Issue Form 파서
      - name: Issue Parser
        uses: stefanbuck/github-issue-parser@v3
        id: issue-parser
        with:
          template-path: .github/ISSUE_TEMPLATE/issue-form.yml

      # 3. 라벨 자동 적용
      - name: Apply GitHub Label
        uses: actions-ecosystem/action-add-labels@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          labels: ${{ steps.issue-parser.outputs.issueparser_issueType }}

      # 4. Markdown → Jira 포맷 변환
      - name: Convert markdown to Jira Syntax
        uses: peter-evans/jira2md@v1
        id: md2jira
        with:
          input-text: |
            ### Github Issue Link
            - ${{ github.event.issue.html_url }}

            ${{ github.event.issue.body }}
          mode: md2jira

      # 5. Jira Issue 생성
      - name: Create Issue
        id: create
        uses: atlassian/gajira-create@v3
        with:
          project: MOONO
          issuetype: Task
          summary: '${{ github.event.issue.title }}'
          description: '${{ steps.md2jira.outputs.output-text }}'
          fields: |
            {
              "parent": {
                "key": "${{ steps.issue-parser.outputs.issueparser_parentKey }}"
              },
              "labels": [
                "${{ steps.issue-parser.outputs.issueparser_issueType }}"
              ]
            }

      - name: Log created issue
        run: echo "Jira Issue ${{ steps.create.outputs.issue }} created"

      # 6. develop 기반으로 feature 브랜치 생성
      - name: Create branch with Ticket number
        run: |
          ISSUE_NUMBER="${{ steps.create.outputs.issue }}"
          RAW_TITLE="${{ steps.issue-parser.outputs.issueparser_branch }}"
          CLEAN_TITLE=$(echo "$RAW_TITLE" | sed 's/ /-/g')
          ISSUE_TYPE="${{ steps.issue-parser.outputs.issueparser_issueType }}"

          BRANCH_NAME="${ISSUE_TYPE}-${ISSUE_NUMBER}/${CLEAN_TITLE}"

          git checkout -b "${BRANCH_NAME}"
          git push origin "${BRANCH_NAME}"

      # 7. GitHub Issue 제목 업데이트
      - name: Update issue title
        uses: actions-cool/issues-helper@v3
        with:
          actions: 'update-issue'
          token: ${{ secrets.GITHUB_TOKEN }}
          title: '[${{ steps.create.outputs.issue }}] ${{ github.event.issue.title }}'

      # 8. 댓글로 Jira 링크 달기
      - name: Add comment with Jira issue link
        uses: actions-cool/issues-helper@v3
        with:
          actions: 'create-comment'
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.issue.number }}
          body: 'Jira Issue Created: [${{ steps.create.outputs.issue }}](${{ secrets.JIRA_BASE_URL }}/browse/${{ steps.create.outputs.issue }})'